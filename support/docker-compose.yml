networks:
  main:

services:
  minio:
    image: "quay.io/minio/minio:RELEASE.2024-07-29T22-14-52Z"
    command: 'server /data --console-address ":9002"'
    expose:
      - "9000"
      - "9002"
    ports:
      - "9000:9000"
      - "9002:9002"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    volumes:
      - ".tmp/minio-data:/data"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000'"]
      interval: "5s"
      timeout: "5s"
      retries: "10"
      start_period: "20s"
    networks:
      main:
        aliases:
          - "minio"

  rbportal:
    build:
      context: "../"
      dockerfile: "./support/Dockerfile"
    expose:
      - "1500"
      - "9876"
    ports:
      - "1500:1500"
      - "9876:9876"
    environment:
      - "NODE_ENV=${RBPORTAL_NODE_ENV:-production}"
      - "sails_appUrl=http://localhost:1500"
      - "sails_log__level=verbose"
      - "PORT=1500"
      - "sails_hooks__sockets=false"
      - "sails_datastores__mongodb__url=mongodb://mongodb:27017/redbox-portal"
      - "sails_admin__api_token=6b088b4d-d54c-470c-8568-2f2695fcdab9"
      - "sails_brandingConfigurationDefaults__auth__local__default__token=6b088b4d-d54c-470c-8568-2f2695fcdab9"
      - "sails_auth__default__local__default__token=6b088b4d-d54c-470c-8568-2f2695fcdab9"
      - "sails_brandingConfigurationDefaults__pdfgen__token=6b088b4d-d54c-470c-8568-2f2695fcdab9"
      - "sails_auth__default__local_pdfbot_token=6b088b4d-d54c-470c-8568-2f2695fcdab9"
      - "sails_session__secret=pdfgen-local-session-secret"
      - "sails_sockets__onlyAllowOrigins__0=http://localhost:1500"
      - "sails_sockets__onlyAllowOrigins__1=http://support-rbportal-1:1500"
      - "sails_record__baseUrl__mint=https://demo.redboxresearchdata.com.au/mint"
      - "LOAD_DEFAULT_FORMS=true"
      - "HOOK_S3_ACCESS_KEY=minioadmin"
      - "HOOK_S3_SECRET_KEY=minioadmin"
      - "HOOK_S3_REGION=ap-southeast-2"
      - "HOOK_S3_BUCKET=attachments"
      - "HOOK_S3_ENDPOINT=http://minio:9000"
    volumes:
      - ".tmp/attachments:/attachments"
      - "../:/opt/sails-hook-redbox-pdfgen"
      - "../config/agendaQueue.js:/opt/redbox-portal/packages/redbox-core/dist/config/agendaQueue.config.js:ro"
      - "../config/recordtype.js:/opt/redbox-portal/packages/redbox-core/dist/config/recordtype.config.js:ro"
      - "../../redbox-portal/packages/redbox-core/src/services/FormsService.ts:/opt/redbox-portal/packages/redbox-core/src/services/FormsService.ts"
      - "../../redbox-portal/packages/redbox-core/dist/services/FormsService.js:/opt/redbox-portal/packages/redbox-core/dist/services/FormsService.js"
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:1500"]
      interval: "5s"
      timeout: "5s"
      retries: "10"
      start_period: "30s"
    networks:
      main:
        aliases:
          - "rbportal"
    depends_on:
      minio:
        condition: "service_healthy"
      mongodb:
        condition: "service_healthy"
      solr:
        condition: "service_healthy"
    entrypoint: >-
      /bin/bash -c "
      /opt/sails-hook-redbox-pdfgen/support/prepare-guest.sh &&
      cd /opt/redbox-portal &&
      node --inspect=0.0.0.0:9876 --enable-source-maps app.js"

  mongodb:
    image: "mongo:6"
    expose:
      - "27017"
    ports:
      - "27017:27017"
    volumes:
      - ".tmp/mongo:/data/db"
    healthcheck:
      test: ["CMD-SHELL", 'echo ''db.runCommand("ping").ok'' | mongosh']
      interval: "5s"
      timeout: "5s"
      retries: "10"
      start_period: "30s"
    networks:
      main:
        aliases:
          - "mongodb"

  solr:
    image: "solr:8.11.1"
    expose:
      - "8983"
    ports:
      - "8983:8983"
    environment:
      - "SOLR_HOME=/var/solr/data"
    volumes:
      - ".tmp/solr:/var/solr/data"
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:8983"]
      interval: "5s"
      timeout: "5s"
      retries: "10"
    networks:
      main:
        aliases:
          - "solr"
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - redbox
